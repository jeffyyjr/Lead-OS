services:
  - type: web
    name: lead-os
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lead-os-db
          property: connectionString
      - key: ADMIN_API_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GMAIL_ADDRESS
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false

databases:
  - name: lead-os-db
    plan: free
